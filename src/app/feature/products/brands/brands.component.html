<h2 class="text-green-600 my-3 p-4 py-5 text-center text-4xl font-semibold">
    All Brands
</h2>

<div class="parent w-9/12 mx-auto pt-2 mx-2 my-3 grid gap-2 md:gap-4 grid-cols-2 md:grid-cols-4 sm:grid-cols-1">
    @for (oneBrand of allBrands(); track oneBrand._id) {
    <div class="group bg-white border border-green-100 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700
             hover:border-green-300 hover:border-3
             hover:shadow hover:scale-105 hover:shadow-lg transition-transform transition-shadow duration-400 ease-in"
        (click)="openBrandModal(oneBrand)">

        <img class="rounded-t-lg w-full" [src]="oneBrand.image" [alt]="oneBrand.name" />
        <div class="p-5">
            <h5 class="mb-2 text-2xl font-semibold text-center tracking-tight text-gray-900 dark:text-white">
                {{ oneBrand.name }}
            </h5>
        </div>

    </div>
    }
</div>

<!-- Modal always in DOM -->
<div [class.hidden]="!isModalOpen()"
    class="fixed top-0 left-0 w-full h-full flex items-center justify-center z-50 bg-black/50">
    <div class="bg-white dark:bg-gray-700 p-5 rounded-lg max-w-lg w-full relative">

        <button (click)="closeModal()"
            class="text-black text-right hover:text-gray-900 dark:hover:text-white">✕</button>

        <div class="flex items-center justify-between">
            <div class="flex justify-around flex-col gap-5 items-center mb-4">
                <h3 class="text-4xl font-semibold text-green-500 dark:text-white">
                    {{ selectedBrand().name }}
                </h3>
                <p class="text-black dark:text-gray-400">
                    {{ selectedBrand().slug }}
                </p>

            </div>

            <div class="flex gap-4">
                <img class="w w-[70%] rounded-lg" [src]="selectedBrand().image" [alt]="selectedBrand().name" />
            </div>
        </div>





        <!-- Footer -->
        <div class="mt-4 flex justify-end">
            <button (click)="closeModal()"
                class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 dark:bg-gray-800 dark:hover:bg-gray-600">
                Close
            </button>
        </div>
    </div>
</div>
