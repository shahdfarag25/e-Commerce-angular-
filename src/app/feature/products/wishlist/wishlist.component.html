<p>wishlist works!</p>
<div class="relative  overflow-x-auto shadow-md sm:rounded-lg mb-5">

    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-16 py-3">
                    <span class="sr-only">Image</span>
                </th>
                <th scope="col" class="px-6 py-3">
                    Product
                </th>
                <th scope="col" class="px-6 py-3">
                    Price
                </th>
                <th scope="col" class="px-6 py-3">
                    Remove
                </th>
                <th scope="col" class="px-6 py-3">
                    Buy Now
                </th>

            </tr>
        </thead>
        <tbody>
            @for (item of allWishlist() ; track item._id){
            <tr
                class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                <td class="p-4">
                    <img [src]="item.imageCover" class="w-16 md:w-32 max-w-full max-h-full" alt="Apple Watch">
                </td>
                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                    {{item.title}}
                </td>
                <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
                    {{item.price}} EGP
                </td>
                <td class="px-6 py-4 ">
                    <a (click)="removeItem(item._id)"
                        class="font-medium cursor-pointer text-red-600 dark:text-red-500 hover:underline">Remove</a>

                </td>
                <td class="px-6 py-4 ">
                    <a (click)="addToCart(item._id)"
                        class="font-medium cursor-pointer text-red-600 dark:text-red-500 hover:underline">
                        Add to cart</a>
                </td>
            </tr>
            }
        </tbody>
    </table>

</div>
